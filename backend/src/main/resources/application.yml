spring:
  application:
    name: messaging-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messaging}
    username: ${DB_USERNAME:messaging}
    password: ${DB_PASSWORD:messaging}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
